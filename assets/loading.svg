<svg width="820" height="95" viewBox="0 0 820 95" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neonGlow" x="-50%" y="-250%" width="200%" height="600%">
      <feGaussianBlur stdDeviation="2.4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="deepRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#52000f"/>
      <stop offset="30%" stop-color="#7a0018"/>
      <stop offset="65%" stop-color="#b30026"/>
      <stop offset="100%" stop-color="#ff1e46"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .title{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2.2px;
      fill: #f5f5f5;
    }

    .sub{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10.5px;
      fill: #9ca3af;
      letter-spacing: 0.7px;
    }
  </style>

  <!-- título -->
  <text x="410" y="24" text-anchor="middle" class="title">LOADING PROJECTS</text>

  <!-- indicador esquerdo -->
  <rect x="204" y="43" width="5" height="5" fill="#ff1744" filter="url(#neonGlow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>

  <!-- trilho -->
  <rect x="215" y="42" width="390" height="6" fill="#0b0d10"/>
  <rect x="215" y="42" width="390" height="1" fill="#2a0a12" opacity="0.95"/>
  <rect x="215" y="47" width="390" height="1" fill="#050607" opacity="0.95"/>

  <!-- barra -->
  <rect x="215" y="42" width="108" height="6" rx="0.6" fill="url(#deepRed)" filter="url(#neonGlow)">
    <animate attributeName="x" values="215;497;215" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- highlight -->
  <rect x="215" y="42.6" width="108" height="0.9" fill="#ff758f" opacity="0.45">
    <animate attributeName="x" values="215;497;215" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- scan -->
  <rect x="224" y="43" width="26" height="4" fill="url(#scan)" opacity="0.85">
    <animate attributeName="x" values="224;570;224" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- indicador direito -->
  <rect x="611" y="43" width="5" height="5" fill="#ff1744" filter="url(#neonGlow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" repeatCount="indefinite"/>
  </rect>

  <!-- texto -->
  <text x="410" y="70" text-anchor="middle" class="sub">Building repositories...</text>
</svg>
